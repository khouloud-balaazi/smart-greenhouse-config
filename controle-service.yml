    port: 5672
    username: qiyhxqyw
    password: cqmNazI1t4eaWlutnCjEwBYqat_BNcbX
    virtual-host: qiyhxqyw
    ssl:
      enabled: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
    rabbit:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
